<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghostline Inks</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0a0a0a;
      color: #fff;
    }
    header {
      text-align: center;
      padding: 40px 20px;
      background: #111;
      border-bottom: 2px solid #ff2e88;
    }
    header img {
      width: 180px;
      border-radius: 10px;
    }
    h1 {
      color: #ff2e88;
      margin: 10px 0;
    }
    .description {
      font-style: italic;
      color: #ccc;
    }
    section {
      padding: 40px 20px;
      max-width: 900px;
      margin: auto;
    }
    .price-list {
      border: 1px solid #ff2e88;
      border-radius: 10px;
      padding: 20px;
    }
    .price-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #333;
    }
    .price-item:last-child {
      border-bottom: none;
    }
    .highlight {
      color: #ff2e88;
    }
    footer {
      text-align: center;
      padding: 20px;
      background: #111;
      border-top: 2px solid #ff2e88;
    }
    a {
      color: #ff2e88;
      text-decoration: none;
    }
  </style>
</head>
